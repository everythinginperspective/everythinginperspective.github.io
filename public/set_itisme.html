<!DOCTYPE html>
<html>
<head>
    <title>Set itisme Flag</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0051D5;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>Set itisme Flag</h1>
    <p>Enter a value to identify this browser/device:</p>
    <input type="text" id="ismeInput" placeholder="e.g., iPhone Safari iOS, Desktop macOS12 Firefox, etc." />
    <button onclick="setIsMe()">Set is_me</button>
    <div id="result" class="result"></div>

    <script>
        function setIsMe() {
            const value = document.getElementById('ismeInput').value.trim();
            if (!value) {
                alert('Please enter a value');
                return;
            }
            localStorage.setItem('itisme', value);
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '✓ itisme set to: "' + value + '"';
            resultDiv.className = 'result success';
            resultDiv.style.display = 'block';
        }

        // Allow Enter key to submit
        document.getElementById('ismeInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                setIsMe();
            }
        });
    </script>
</body>
</html>
