<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Prism splitting light into spectrum -->
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="16.66%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="33.33%" style="stop-color:#EAB308;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="66.66%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="83.33%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- White background -->
  <rect width="64" height="64" fill="#ffffff"/>
  
  <!-- Prism shape (triangle) -->
  <polygon points="16,48 32,8 48,48" fill="url(#rainbow)" stroke="#1F2937" stroke-width="1.5"/>
  
  <!-- Light rays entering from left -->
  <line x1="8" y1="24" x2="16" y2="40" stroke="#9CA3AF" stroke-width="1.5" opacity="0.6"/>
  <line x1="8" y1="32" x2="16" y2="40" stroke="#9CA3AF" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Refracted rays exiting right -->
  <line x1="48" y1="40" x2="56" y2="20" stroke="#EF4444" stroke-width="1.5" opacity="0.8"/>
  <line x1="48" y1="40" x2="56" y2="28" stroke="#3B82F6" stroke-width="1.5" opacity="0.8"/>
  <line x1="48" y1="40" x2="56" y2="36" stroke="#A855F7" stroke-width="1.5" opacity="0.8"/>
</svg>
